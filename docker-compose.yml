services:
  db:
    image: postgres:17
    container_name: tender_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tender_agent
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
